services:
  agent:
    image: saskia2111/inswitch:${TAG:-latest}
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Base URL for the k8s-manager API. The compose service DNS name points
      # at the local mock; override to target a real cluster (port 8000).
      - K8S_MANAGER_URL=${K8S_MANAGER_URL:-http://test-api:8001}
    volumes:
      - ./workspace:/workspace
      - ./logs:/logs
  dashboard:
    image: saskia2111/inswitch-dashboard:${TAG:-latest}
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
  test-api:
    image: songhui/inswitch-test-api:${TAG:-latest}
    build:
      context: ./test-api
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
